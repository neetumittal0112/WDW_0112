<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register Form</title>
</head>
<body>
<h1 align="center">Student Registration form</h1>
<form action=""submit.html" method="post">
<!--Name-->
<label>Full Name:</label>
<input type="text" name="full name" placeholder="Enter your full name" required>
<br><br>
<!--Email-->
<label>Email:</label>
<input type="email" name="email" placeholder="Enter valid email address" required>
<br><br>
<!--Password-->
<label>Password:</label>
<input type="password" name="password" placeholder="Enter password" required>
<br><br>
<!--Gender-->
<label>Gender:</label>
<input type="radio" name="Gender" value="Male">Male
<input type="radio" name="Gender" value="Female">Female
<input type="radio" name="Gender" value="Other">Other
<br><br>
<!--Course-->
<label>Course:</label>
<Select name="Course" required>
    <option value=" ">--Select course</option>
    <option value="CSE">CSE</option>
    <option value="ECE">ECE</option>
    <option value="ELCE">ELCE</option>
</Select>
<br><br>
<!--Contact No:-->
<label>Contact No:</label>
<input type="tel" name="Contact" placeholder="Enter phone Number" required>
<br><br>
<!--Address-->
<label>Address:</label>
<textarea name="address" rows="4" cols="40" placeholder="Enter your address" required>
</textarea>
<br><br>
<!--Submit and Reset-->
<input type="submit" value="Register">
<input type="reset" value="Clear">
<br><br>
</form>
<h2 align="center">&copy;2025 Student Registration Portal.</h2>
</body>
</html>
